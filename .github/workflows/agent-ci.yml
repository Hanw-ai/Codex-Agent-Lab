name: Coding Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - task_id: task_001
            task_file: tasks/task_001.json
            test_file: test_calculator.py
          
          - task_id: task_002
            task_file: tasks/task_002.json
            test_file: test_username.py

          - task_id: task_003
            task_file: tasks/task_003.json
            test_file: test_deduplicate.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest

      - name: Verify buggy baseline
        working-directory: workspace
        run: |
          if python -m pytest ${{ matrix.test_file }} -q; then
            echo "Expected the baseline task to fail, but it passed."
            exit 1
          else
            echo "Baseline failure confirmed."
          fi

      - name: Run coding agent
        run: python run_agent.py ${{ matrix.task_file }}

      - name: Verify repaired workspace
        working-directory: workspace
        run: python -m pytest ${{ matrix.test_file }} -q

      - name: Verify trajectory artifact
        env:
          TASK_ID: ${{ matrix.task_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          task_id = os.environ["TASK_ID"]
          path = Path(f"outputs/{task_id}_trajectory.json")

          assert path.exists(), f"Trajectory artifact was not generated: {path}"

          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["task_id"] == task_id

          actions = [step["action"] for step in data["steps"]]

          assert actions == [
          "inspect_source",
          "run_tests_before_repair",
          "generate_repair_plan",
          "apply_patch",
          "run_tests_after_repair",
          ]

          assert data["steps"][0]["success"] is True
          assert data["steps"][1]["success"] is False
          assert data["steps"][2]["success"] is True
          assert data["steps"][3]["success"] is True
          assert data["steps"][4]["success"] is True

          print(f"Trajectory verification passed for {task_id}.")
          PY