name: Coding Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest

      - name: Verify buggy baseline
        working-directory: workspace
        run: |
          if python -m pytest -q; then
            echo "Expected the baseline task to fail, but it passed."
            exit 1
          else
            echo "Baseline failure confirmed."
          fi

      - name: Run coding agent
        run: python run_agent.py

      - name: Verify repaired workspace
        working-directory: workspace
        run: python -m pytest -q

      - name: Verify trajectory artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/task_001_trajectory.json")

          assert path.exists(), "Trajectory artifact was not generated."

          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["task_id"] == "task_001"

          actions = [step["action"] for step in data["steps"]]

          assert actions == [
              "run_tests_before_repair",
              "repair_file",
              "run_tests_after_repair",
          ]

          assert data["steps"][0]["success"] is False
          assert data["steps"][1]["success"] is True
          assert data["steps"][2]["success"] is True

          print("Trajectory verification passed.")
          PY
